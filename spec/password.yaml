module: Password

non_functional_requirements:
  - id: NFR-1
    desc: "Пароль должен быть длиной не менее 8 символов"
  - id: NFR-2
    desc: "Пароль должен содержать минимум 3 из 4 типов символов"
  - id: NFR-3
    desc: "Пароль не должен быть общим шаблоном"
  - id: NFR-4
    desc: "Хэш пароля должен быть необратимым и уникальным"

methods:
  - name: Passwordlength
    req_functional: ["FR-1"]
    req_non_functional: ["NFR-1"]
    signature: "bool Passwordlength(string password)"
    pre: "true"
    post: "password != null && password.Length >= 8 → true, иначе false"
    equivalence_classes:
      - case: "Пароль длиной 8 символов"
        inputs: ["Password1"]
        expected: "true"
      - case: "Пароль длиной менее 8 символов"
        inputs: ["Pass"]
        expected: "false"
      - case: "Пароль null"
        inputs: ["null"]
        expected: "false"

  - name: DiversityOfSymbols
    req_functional: ["FR-2"]
    req_non_functional: ["NFR-2", "NFR-3"]
    signature: "bool DiversityOfSymbols(string password)"
    pre: "true"
    post: "пароль содержит >=3 типов символов → true, иначе false"
    equivalence_classes:
      - case: "Сложный пароль (буквы+цифры+символы)"
        inputs: ["P@ssw0rd!"]
        expected: "true"
      - case: "Только буквы"
        inputs: ["OnlyLetters"]
        expected: "false"
      - case: "Только цифры"
        inputs: ["12345678"]
        expected: "false"
      - case: "Общий шаблон"
        inputs: ["password123"]
        expected: "false"

  - name: HashPassword
    req_functional: ["FR-3"]
    req_non_functional: ["NFR-4"]
    signature: "string HashPassword(string password)"
    pre: "password != null && !string.IsNullOrWhiteSpace(password)"
    post: "возвращает непустую строку"
    equivalence_classes:
      - case: "Валидный пароль"
        inputs: ["MySecureP@ss"]
        expected: "непустая строка"
      - case: "Пустой пароль"
        inputs: [""]
        expected: "ArgumentException"

  - name: ChangePassword
    req_functional: ["FR-4"]
    req_non_functional: ["NFR-1", "NFR-2", "NFR-3"]
    signature: "void ChangePassword(string oldPassword, string newPassword)"
    pre: "старый и новый пароли не null"
    post: "newPassword валиден → пароль изменён, иначе ArgumentException"
    equivalence_classes:
      - case: "Успешная смена"
        inputs: ["OldP@ss1", "NewP@ss2"]
        expected: "без исключений"
      - case: "Новый пароль короткий"
        inputs: ["OldP@ss1", "123"]
        expected: "ArgumentException"
      - case: "Новый пароль слабый"
        inputs: ["OldP@ss1", "weakpass"]
        expected: "ArgumentException"